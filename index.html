  const share='<div class="row"><span class="lbl">Raum-Code</span><span class="code" style="font-size:22px">'+esc(code)+'</span><button class="btn sm" data-act="gw-copy" type="button">'+(gwLink(code)?'Link kopieren':'Code kopieren')+'</button></div>';
  const friends=S.friends.list.length?'<details class="gwinv"><summary>Freunde einladen</summary>'+S.friends.list.map(f=>{const st=friendState(f.key);const inRoom=ps.some(p=>p.key===f.key);
    return '<div class="fr'+(st.on?' on':'')+'"><span class="frdot"></span><div class="frtxt"><b>'+esc(f.name)+'</b><span class="small muted">'+(inRoom?'ist im Raum':esc(st.txt))+'</span></div>'+(inRoom?'':'<button class="btn sm" data-act="gw-invite" data-key="'+esc(f.key)+'" type="button">Einladen</button>')+'</div>';}).join('')+'</details>':'';
  if(d.status!=='play'||!d.g){
    view.innerHTML='<section class="hero" style="padding-top:4px"><span class="lbl">Geheimwort · Raum '+esc(code)+'</span><h1>Teams wählen</h1><p class="small" id="connline">'+connText()+'</p></section>'+
      '<section class="card">'+share+friends+'</section>'+
      '<section class="card"><p class="small muted">Tipp bei einem Team auf „Agent“ oder „Chef“. Jedes Team braucht genau einen Chef. Hat ein Team keine Agenten, rät der Chef selbst.</p>'+teams+
      (unassigned.length?'<p class="small muted">Ohne Team: '+unassigned.map(p=>esc(p.name)).join(', ')+'</p>':'')+
      '<button class="btn pri" data-act="gw-start" type="button" style="align-self:flex-start"'+(gwSpyOf(code,'r')&&gwSpyOf(code,'b')?'':' disabled')+'>Spiel starten</button></section>'+
      '<div class="bar"><button class="btn ghost" data-act="gw-leave-ask" type="button">Raum verlassen</button><button class="btn" data-act="go" data-v="gw-home" type="button">Zurück</button></div>';
    return;
  }
  const g=d.g,spyView=me.role==='spy'||!!g.winner;
  let action='';
  if(gwCanClue(code,g))action='<section class="card gwaction"><h3>Du bist Chef von '+TEAM[me.team]+'. Gib einen Hinweis:</h3>'+gwClueForm(false)+'</section>';
  else if(gwCanGuess(code,g))action='<div class="row gwguessrow"><span class="small">Tippe ein Wort zweimal an, um es aufzudecken.</span>'+(g.guessed>0?'<button class="btn sm" data-act="gw-endturn" type="button">Raten beenden</button>':'')+'</div>';
  else if(!g.winner&&!me.team)action='<p class="small muted">Du schaust zu. Wähl unten ein Team, um mitzuspielen.</p>';
  view.innerHTML='<section class="gwhead"><div class="row" style="justify-content:space-between"><span class="lbl">Geheimwort · Raum '+esc(code)+'</span><span class="small muted">'+(me.team?'Du: '+TEAM[me.team]+' · '+(me.role==='spy'?'Chef':'Agent'):'Zuschauer')+'</span></div>'+gwStatusHTML(g,me.team)+'</section>'+
    action+gwBoardHTML(g,spyView)+
    (g.winner?'<div class="row"><button class="btn pri" data-act="gw-start" type="button">Neue Runde</button><button class="btn" data-act="gw-lobby" type="button">Teams neu wählen</button></div>':'')+
    '<section class="card"><h3>Verlauf</h3>'+gwLogHTML(g)+'</section>'+
    '<section class="card"><h3>Teams</h3>'+teams+share+friends+'</section>'+
    '<div class="bar"><button class="btn ghost" data-act="gw-leave-ask" type="button">Raum verlassen</button><button class="btn" data-act="go" data-v="gw-home" type="button">Zurück</button></div>';
}
function drawGwLocal(){
  const ae=document.activeElement;
  if(ae&&ae.id==='gwclue'&&document.getElementById('gwclue'))return;
  if(!GW.local){S.view='gw-home';return drawGwHome();}
  const g=GW.local.g;
  let action='';
  if(!g.winner){
    if(g.phase==='clue')action='<section class="card gwaction"><h3>Chef von '+TEAM[g.turn]+': Karte ansehen und Hinweis sagen</h3><p class="small muted">Halte den Knopf gedrückt, damit nur du die Karte siehst. Den Hinweis kannst du laut sagen oder hier eintippen.</p>'+gwClueForm(true)+'</section>';
    else action='<div class="row gwguessrow"><span class="small">Team '+TEAM[g.turn]+': Wort zweimal antippen.</span><button class="btn sm" data-act="gw-endturn" type="button">Raten beenden</button></div>';
  }
  view.innerHTML='<section class="gwhead"><span class="lbl">Geheimwort · an einem Gerät</span>'+gwStatusHTML(g,null)+'</section>'+action+
    gwBoardHTML(g,GW.hold||!!g.winner)+
    '<div class="row">'+(!g.winner?'<button class="btn hold gwhold" data-gwhold="1" type="button">'+(GW.hold?'Karte sichtbar':'Geheime Karte zeigen (halten)')+'</button>':'')+
    '<button class="btn'+(g.winner?' pri':' ghost danger')+'" data-act="'+(g.winner?'gw-local-new':'gw-local-new-ask')+'" type="button">Neues Spiel</button></div>'+
    '<section class="card"><h3>Verlauf</h3>'+gwLogHTML(g)+'</section>'+
    '<div class="bar"><button class="btn" data-act="go" data-v="gw-home" type="button">Zurück</button></div>';
}
function gwAct(act,b){
  switch(act){
    case 'gw-create':gwCreate();return true;
    case 'gw-join':gwJoin(b.dataset.code);return true;
    case 'gw-join-input':{const el=document.getElementById('gwcode');gwJoin(el?el.value:GW.joinCode);return true;}
    case 'gw-decline':Net.pub(P+'u/'+S.me.key+'/cninv/'+b.dataset.code,null);delete GW.inv[b.dataset.code];render();return true;
    case 'gw-role':{const t=b.dataset.team,role=b.dataset.role;const spy=gwSpyOf(GW.cur,t);
      if(role==='spy'&&spy&&spy.key!==S.me.key){toast(spy.name+' ist schon Chef von '+TEAM[t]+'.');return true;}
      gwPubMe(GW.cur,{team:t,role});return true;}
    case 'gw-start':gwStart(GW.cur);return true;
    case 'gw-lobby':{const d=GW.rooms[GW.cur];if(d){const nd=clone(d);nd.status='lobby';gwPubRoom(nd);}return true;}
    case 'gw-invite':{const f=S.friends.list.find(x=>x.key===b.dataset.key);if(f)gwInvite(GW.cur,f);return true;}
    case 'gw-copy':{const txt=gwLink(GW.cur)||GW.cur;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(gwLink(GW.cur)?'Link kopiert':'Code kopiert'),()=>toast('Code: '+GW.cur));return true;}
    case 'gw-leave-ask':showOverlay('<h2>Raum verlassen?</h2><p>Du kannst mit dem Code '+esc(GW.cur)+' jederzeit wieder beitreten.</p><div class="row"><button class="btn" data-act="close" type="button">Bleiben</button><button class="btn pri" data-act="gw-leave" type="button">Verlassen</button></div>');return true;
    case 'gw-leave':gwLeave(GW.cur);return true;
    case 'gw-clue':gwSubmitClue();return true;
    case 'gw-endturn':{const ctx=gwCtx();if(ctx){GW.confirm=null;gwSetG(ctx,gwEndTurn(ctx.g));}return true;}
    case 'gw-local-new':hideOverlay();GW.local={g:gwNewBoard(GW.local&&GW.local.g&&GW.local.g.start)};GW.confirm=null;GW.hold=false;LS.set('hrs-gwlocal',GW.local);S.view='gw-local';render();window.scrollTo(0,0);return true;
    case 'gw-local-new-ask':showOverlay('<h2>Neues Spiel?</h2><p>Das laufende Spiel geht verloren.</p><div class="row"><button class="btn" data-act="close" type="button">Weiterspielen</button><button class="btn pri" data-act="gw-local-new" type="button">Neues Spiel</button></div>');return true;
    case 'gw-local-resume':S.view='gw-local';GW.confirm=null;render();return true;
  }
  return false;
}

/* ================= Name ================= */
let ownerProbe=null;
function saveName(force){
  const inp=document.getElementById('nameinp');const name=(inp?inp.value:S.nameDraft).trim().replace(/\s+/g,' ');
  S.nameDraft=name;
  const key=normKey(name);
  if(!key||key.length<2){S.nameErr='Bitte mindestens 2 Zeichen.';return render();}
  const finish=()=>{
    const old=S.me;
    if(old&&old.key!==key){Net.pub(P+'u/'+old.key+'/status',{name:old.name,online:false});Net.stop();S.index={};S.invites={};}
    S.me={name,key};LS.set('hrs-me',S.me);
    S.nameErr='';S.nameTaken=false;S.view='home';
    if(!Net.clients.length){Net.start();subscribeMe();}
    setTimeout(gwHashJoin,0);
    Net.pub(P+'u/'+key+'/owner',{dev});
    render();
  };
  if(force)return finish();
  // Prüfen, ob der Name schon auf einem anderen Gerät benutzt wird
  if(!window.mqtt){return finish();}
  S.nameErr='Prüfe den Namen …';render();
  const probe=[];let done=false;
  const end=taken=>{if(done)return;done=true;for(const c of probe)try{c.end(true);}catch(e){}
    if(taken){S.nameTaken=true;S.nameErr='„'+name+'“ wird schon auf einem anderen Gerät benutzt.';render();}else finish();};
  for(const url of BROKERS){
    try{const c=mqtt.connect(url,{clientId:'hrsp_'+rid(8),connectTimeout:6000,reconnectPeriod:0});probe.push(c);
      c.on('connect',()=>c.subscribe(P+'u/'+key+'/owner'));
      c.on('message',(t,b)=>{const s=b.toString();if(!s)return;try{const o=JSON.parse(s);if(o.dev&&o.dev!==dev)end(true);}catch(e){}});
      c.on('error',()=>{});}catch(e){}
  }
  setTimeout(()=>end(false),2500);
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const sq=e.target.closest('[data-sq]');if(sq&&view.contains(sq)){onSquare(+sq.dataset.sq);return;}
  const gc=e.target.closest('[data-gw]');if(gc&&view.contains(gc)){gwTap(+gc.dataset.gw);return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  if(gwAct(b.dataset.act,b))return;
  const act=b.dataset.act,gid=b.dataset.gid;
  switch(act){
    case 'go':GW.err='';hideOverlay();S.view=b.dataset.v;S.sel=null;S.challengeErr='';render();window.scrollTo(0,0);break;
    case 'name-save':saveName(false);break;
    case 'name-force':saveName(true);break;
    case 'name-other':S.nameTaken=false;S.nameErr='';S.nameDraft='';render();break;
    case 'rename':S.nameDraft=S.me.name;S.me=null;render();break;
    case 'start-local':startLocal();break;
    case 'resume':S.gid='local';S.view='game';S.sel=null;render();break;
    case 'challenge':challenge();break;
    case 'accept':acceptInvite(gid);break;
    case 'decline':declineInvite(gid);break;
    case 'cancel':cancelChallenge(gid);break;
    case 'open':openGame(gid);break;
    case 'remove':removeGame(gid);break;
    case 'rematch':rematch(gid);break;
    case 'resign-ask':showOverlay('<h2>Aufgeben?</h2><p>Die Partie zählt dann als verloren.</p><div class="row"><button class="btn" data-act="close" type="button">Weiterspielen</button><button class="btn pri" data-act="resign" type="button">Aufgeben</button></div>');break;
    case 'resign':resign();break;
    case 'close':hideOverlay();break;
    case 'undo':if(S.local.undo&&S.local.undo.length){S.local.G=S.local.undo.pop();S.sel=null;saveLocal();render();}break;
    case 'flip':S.flip=!S.flip;render();break;
    case 'restart':showOverlay('<h2>Neu starten?</h2><p>Die aktuelle Partie geht verloren.</p><div class="row"><button class="btn" data-act="close" type="button">Weiterspielen</button><button class="btn pri" data-act="restart-confirm" type="button">Neu starten</button></div>');break;
    case 'restart-confirm':hideOverlay();{const v=S.local.v.ruleIds?buildVariant(S.local.v.ruleIds):S.local.v;S.local={v,G:newGame(v),undo:[]};S.pickReady=false;S.sel=null;saveLocal();render();}break;
    case 'roll':{const ctx=gameCtx();if(ctx&&!ctx.G.dice){const ng=rollDice(ctx.G);setState(ctx,ng,false);if(legalMoves(ctx.v,ng,ng.turn).length===0)toast('Mit diesem Wurf ist kein Zug möglich.');}break;}
    case 'endturn':{const ctx=gameCtx();if(ctx&&ctx.G.dice){S.sel=null;setState(ctx,endTurn(ctx.v,ctx.G,ctx.G.dice.every(x=>!x.used)),true);}break;}
    case 'rp-prev':replayStep(-1);break;
    case 'rp-next':replayStep(1);break;
    case 'rp-live':replayStep(0);break;
    case 'drawer':S.drawer=true;render();break;
    case 'drawer-close':S.drawer=false;render();break;
    case 'fr-add':{const inp=document.getElementById('friendinp');addFriend(inp?inp.value:S.friendInput,false);break;}
    case 'fr-del':removeFriend(b.dataset.key);break;
    case 'fr-play':{const f=S.friends.list.find(x=>x.key===b.dataset.key);const p=f&&S.presence[f.key];S.oppInput=(p&&p.name)||(f&&f.name)||'';S.drawer=false;S.challengeErr='';S.view='online';if(f){S.presAsked[f.key]=S.presAsked[f.key]||Date.now();}render();window.scrollTo(0,0);break;}
    case 'pick-ready':S.pickReady=true;hideOverlay();break;
    case 'promo':{const m=S.pendingPromo;S.pendingPromo=null;const ctx=gameCtx();if(m&&ctx)commit(ctx,m,b.dataset.t);break;}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.rule){const f=t.dataset.field;const cur=S[f].filter(x=>x!==t.dataset.rule);if(t.checked)cur.push(t.dataset.rule);S[f]=cur;LS.set(f==='localRules'?'hrs-rules-local':'hrs-rules-online',cur);render();}
});
let presT;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='oppinp'){S.oppInput=t.value;S.challengeErr='';clearTimeout(presT);presT=setTimeout(()=>{const k=normKey(S.oppInput);if(k&&!S.presAsked[k]){S.presAsked[k]=Date.now();Net.sub(P+'u/'+k+'/status');setTimeout(render,2600);}render();},400);}
  if(t.id==='nameinp'){S.nameDraft=t.value;if(S.nameErr&&!S.nameTaken){S.nameErr='';}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='nameinp')saveName(false);
  if(e.key==='Enter'&&e.target.id==='oppinp')challenge();
  if(e.key==='Escape'&&!overlay.hidden&&!overlay.querySelector('[data-act=pick-ready]'))hideOverlay();
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='gwcode'){GW.joinCode=t.value;GW.err='';}
  if(t.id==='gwclue')GW.clueW=t.value;});
document.addEventListener('change',e=>{if(e.target.id==='gwnum')GW.clueN=e.target.value;});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='gwcode')gwJoin(e.target.value);
  if(e.key==='Enter'&&e.target.id==='gwclue'){GW.clueW=e.target.value;e.target.blur();gwSubmitClue();}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-gwhold]')){GW.hold=true;render();}});
const gwEndHold=()=>{if(GW.hold){GW.hold=false;render();}};
document.addEventListener('pointerup',gwEndHold);document.addEventListener('pointercancel',gwEndHold);
document.getElementById('drawerbg').addEventListener('click',()=>{S.drawer=false;render();});
document.addEventListener('input',e=>{if(e.target.id==='friendinp'){S.friendInput=e.target.value;S.friendErr='';}});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='friendinp')addFriend(e.target.value,false);
  if(S.view==='game'&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){if(e.key==='ArrowLeft')replayStep(-1);if(e.key==='ArrowRight')replayStep(1);}
  if(e.key==='Escape'&&S.drawer){S.drawer=false;render();}
});
// Wischen vom rechten Rand öffnet die Freundesliste, nach rechts wischen schließt sie
let sw=null;
document.addEventListener('touchstart',e=>{const t=e.touches[0];if(!S.me)return;
  if(!S.drawer&&t.clientX>window.innerWidth-28)sw={x:t.clientX,y:t.clientY,open:true};
  else if(S.drawer&&e.target.closest('#drawer'))sw={x:t.clientX,y:t.clientY,open:false};else sw=null;},{passive:true});
document.addEventListener('touchmove',e=>{if(!sw)return;const t=e.touches[0],dx=t.clientX-sw.x,dy=Math.abs(t.clientY-sw.y);
  if(dy>60){sw=null;return;}
  if(sw.open&&dx<-45){S.drawer=true;sw=null;render();}
  else if(!sw.open&&dx>70){S.drawer=false;sw=null;render();}},{passive:true});
document.addEventListener('touchend',()=>{sw=null;});
document.addEventListener('visibilitychange',()=>{if(S.me&&Net.clients.length)Net.pub(P+'u/'+S.me.key+'/status',{name:S.me.name,online:!document.hidden,seen:Date.now()});});
document.addEventListener('focusout',e=>{if(e.target.id==='oppinp')setTimeout(render,0);});
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-hold]')){S.reveal=true;render();}});
const endHold=()=>{if(S.reveal){S.reveal=false;render();}};
document.addEventListener('pointerup',endHold);document.addEventListener('pointercancel',endHold);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.view==='game')render();},150);});

/* ================= Start ================= */
render();
if(S.me){Net.start();subscribeMe();}
function gwHashJoin(){const m=/^#gw-([A-Z0-9]{4})$/i.exec(location.hash||'');if(!m||!S.me)return;try{history.replaceState(null,'',location.pathname);}catch(e){}gwJoin(m[1]);}
gwHashJoin();
window.addEventListener('hashchange',gwHashJoin);

</script>
